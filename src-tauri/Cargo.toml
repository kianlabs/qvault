[package]
name = "qvault"
version = "0.1.0"
description = "QVAULT — Local-First Password Vault & Life OS"
authors = ["Kyan (Ridzkyan)"]
edition = "2021"

[lib]
name = "qvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- QVAULT core ---
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
csv = "1"

# --- Wave 4 (kontrak E.4): TOTP RFC 6238 ---
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
