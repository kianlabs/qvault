# QVAULT — Rilis otomatis (AppImage + updater).
#
# Dipicu saat push tag (mis. v0.2.0). Tag HARUS sama dengan `version` di
# src-tauri/tauri.conf.json (ada guard yang gagal bila tidak cocok).
# Membangun AppImage bertanda tangan, membuat latest.json yang menunjuk ke
# worker proxy, lalu mempublikasikan GitHub Release. Worker (updater-worker/)
# memegang token dan menyajikan aset ini ke app yang terpasang.
#
# Rahasia yang dibutuhkan (Settings → Secrets → Actions):
#   TAURI_SIGNING_PRIVATE_KEY   ISI file ~/.tauri/qvault.key (bukan path)
#
# Kunci qvault.key dibuat TANPA password, jadi TIDAK ada env password di sini.
# Bila kelak kunci dibuat berpassword, tambahkan env
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
#
# CATATAN: jangan menyentuh ci.yml — workflow ini terpisah.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Guard: tag HARUS cocok dengan version di tauri.conf.json. Tanpa ini,
      # tag v0.2.0 saat config masih 0.1.0 akan menerbitkan latest.json dengan
      # versi lama → app menganggap "tidak ada update" tanpa peringatan.
      - name: Verify tag matches config version
        run: |
          CONFIG_VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CONFIG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} tidak cocok dengan versi config ${CONFIG_VERSION}."
            echo "Naikkan version di src-tauri/tauri.conf.json (dan Cargo.toml/package.json) dulu."
            exit 1
          fi
          echo "Versi cocok: ${CONFIG_VERSION}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build AppImage (signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bunx tauri build --bundles appimage

      - name: Generate latest.json
        env:
          WORKER_BASE: https://qvault-updates.kianlabs.workers.dev
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: node scripts/make-latest-json.mjs

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "QVAULT ${GITHUB_REF_NAME}" \
            --notes "Rilis QVAULT ${GITHUB_REF_NAME}." \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.sig \
            latest.json
